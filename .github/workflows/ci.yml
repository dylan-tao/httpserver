name: CI

on:
  push:
    branches: [ main, '3.*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set up Maven 3.9.10
        # ubuntu-latest ships Maven 3.8.x, below the 3.8.9 the
        # spotbugs-maven-plugin requires - without this pin `mvn verify`
        # aborts in the gate plugins. pin the version the project is
        # locally validated with
        run: |
          curl -sSL -o /tmp/maven.tgz https://archive.apache.org/dist/maven/maven-3/3.9.10/binaries/apache-maven-3.9.10-bin.tar.gz
          tar xzf /tmp/maven.tgz -C /tmp
          echo "/tmp/apache-maven-3.9.10/bin" >> $GITHUB_PATH
      - name: Build, test and quality gates
        # verify (not just package): the PMD/SpotBugs check executions
        # bind to the verify phase - a package-only CI never ran the
        # quality gates at all
        run: mvn -B -ntp verify
